<div class="chat-toggle" (click)="toggleChat()">
    <img src="assets/images/LOGO-SmartCare_withBACK.png" alt="MedicalBot" />
  </div>
  
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      🤖 Assistance Médicale
      <span class="close-btn" (click)="toggleChat()">✖</span>
    </div>
  
    <div class="chat-messages">
      <div *ngFor="let msg of messages" [innerHTML]="msg.text" [ngClass]="msg.sender">
        {{ msg.text }}
      </div>
      <div *ngIf="isTyping" class="typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  
    <div class="chat-input">
      <input [(ngModel)]="userInput" placeholder="Posez votre question..." (keyup.enter)="sendMessage()" />
      <button (click)="sendMessage()"><svg cIcon name="cilSend" size="lg" style="color: #6387c0;"></svg></button>
    </div>
  </div>
