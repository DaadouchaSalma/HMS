<c-col [lg]="6">
  <c-card class="mb-4">
    <c-card-body class="p-4">
      <c-row>
        <c-col>
          <h5 cCardTitle class="fs-4 fw-semibold">
            RDVs Mensuels
          </h5>
          <h6 cCardSubtitle class="fw-normal text-body-secondary">
            Répartition Jan - Déc
          </h6>
        </c-col>
      </c-row>
    </c-card-body>

    

    <c-chart
      type="line"
      height="150"
      id="salesChart"
      class="mt-3"
      [data]="salesChart?.data"
      [options]="salesChart?.options">
    </c-chart>
  </c-card>
</c-col>

<c-card class="w-75 mx-auto my-4 shadow-sm">
  <c-card-header class="py-2 px-3 fs-5">Mes Rendez-vous</c-card-header>
  <c-card-body class="p-3">
    <div style="max-height: 600px; overflow-y: auto;">
      <full-calendar #calendar [options]="calendarOptions"></full-calendar>
    </div>
  </c-card-body>
</c-card>

<c-row>
  <c-col [xs]="6">
    <div class="border-start border-start-4 border-start-info py-1 px-3 mb-3">
      <div class="text-body-secondary small">Rendez-vous before 12pm</div>
      <div class="fs-5 fw-semibold">{{ rdvBeforeNoon.length }}</div>

    </div>
  </c-col>
  <c-col [xs]="6">
    <div class="border-start border-start-4 border-start-danger py-1 px-3 mb-3">
      <div class="text-body-secondary small">Rendez-vous after 12pm</div>
      <div class="fs-5 fw-semibold">{{ rdvAfterNoon.length }}</div>
    </div>
  </c-col>
  
</c-row>
