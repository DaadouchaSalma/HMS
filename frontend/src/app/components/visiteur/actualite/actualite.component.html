<!-- Contenu principal -->
<div class="container main-content">
  <!-- Filtres -->
  <div class="filters" @fadeIn>
    <div class="category-filter">
      <button 
        *ngFor="let category of categories" 
        [class.active]="selectedCategory === category"
        (click)="filterByCategory(category)">
        {{ category }}
      </button>
    </div>
    <div class="search-box">
      <input 
        type="text" 
        placeholder="Rechercher..." 
        [(ngModel)]="searchQuery"
        (input)="filterByCategory(selectedCategory)">
      <i class="fas fa-search"></i>
    </div>
  </div>

  <!-- Liste des actualités -->
  <div class="news-grid" [@listAnimation]="filteredActualites.length">
    <!--div class="news-card" *ngFor="let item of filteredActualites" (click)="goToActualite(item.id)"-->
    <div class="news-card" *ngFor="let item of filteredActualites">
      <div class="news-image">
        <img [src]="item.image" [alt]="item.title">
        <span class="news-category">{{ item.category }}</span>
      </div>
      <div class="news-content">
        <h3>{{ item.title }}</h3>
        <p class="news-excerpt">{{ item.excerpt }}</p>
        <div class="news-meta">
          <span><i class="far fa-calendar"></i> {{ item.date | date:'mediumDate' }}</span>
          <span *ngIf="item.location"><i class="fas fa-map-marker-alt"></i> {{ item.location }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Message si aucun résultat -->
  <div class="no-results" *ngIf="filteredActualites.length === 0" @fadeIn>
    <i class="far fa-folder-open"></i>
    <p>Aucun résultat trouvé pour votre recherche</p>
  </div>
</div>
