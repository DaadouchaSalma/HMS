<c-row>
  <c-card-group class="mb-4 custom-card-group">
    <c-col md="3" sm="6"> <!-- Adjust column size as needed -->
      <c-card class="mb-2">
        <div class="widget-stat-small">
          <c-widget-stat-c [title]="'Médecins'" [value]="medecinCount" class="widget-stat">
            <ng-template cTemplateId="widgetIconTemplate">
              <img src="/assets/images/medecin.svg" alt="" height="36">
            </ng-template>
            <ng-template cTemplateId="widgetProgressTemplate">
              <c-progress class="mt-3 mb-0 custom-progress" thin [value]="medecinPercentage" ></c-progress>
            </ng-template>
          </c-widget-stat-c>
        </div>
      </c-card>
    </c-col>
    
    <c-col md="3" sm="6">
      <c-card class="mb-2">
        <div class="widget-stat-small">
          <c-widget-stat-c [title]="'Pharmaciens'" [value]="PharmacienCount" class="widget-stat">
            <ng-template cTemplateId="widgetIconTemplate">
              <img src="/assets/images/pharamacien.svg" alt="" height="36">
            </ng-template>
            <ng-template cTemplateId="widgetProgressTemplate">
              <c-progress class="mt-3 mb-0 custom-progress" thin [value]="pharmacienPercentage" ></c-progress>
            </ng-template>
          </c-widget-stat-c>
        </div>
      </c-card>
    </c-col>
    
    <c-col md="3" sm="6">
      <c-card class="mb-2">
        <div class="widget-stat-small">
          <c-widget-stat-c [title]="'Personnels Administratif'" [value]="AdminiCount"  >
            <ng-template cTemplateId="widgetIconTemplate">
              <!--svg cIcon height="36" name="cilPeople"></svg-->
              <img src="/assets/images/icone_administratif.svg" alt="" height="36">
            </ng-template>
            <ng-template cTemplateId="widgetProgressTemplate">
              <c-progress class="mt-3 mb-0 custom-progress" thin [value]="adminPercentage" ></c-progress>
            </ng-template>
          </c-widget-stat-c>
        </div>
      </c-card>
    </c-col>
  </c-card-group>
</c-row>
<c-row>
  <!-- Doughnut Chart -->
  <c-col [xl]="5">
    <c-card class="mb-4" style="height:398px">
      <c-card-body class="p-4">
        <h5 cCardTitle class="fs-4 fw-semibold">Répartition des Chambres </h5>
        <h6 cCardSubtitle class="fw-normal text-body-secondary">
           Par Statut
        </h6>
        <div >
          <canvas #doughnutChart
                  baseChart
                  [type]="doughnutChartType"
                  [data]="doughnutChartData"
                  [options]="doughnutChartOptions">
          </canvas>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
<c-col [xl]="7">
  <c-card class="mb-4">
    <c-card-body class="p-4">
      <h5 cCardTitle class="fs-4 fw-semibold">Répartition des Réclamations </h5>
      <h6 cCardSubtitle class="fw-normal text-body-secondary">
        Par Type et Année
      </h6>
      <div style="height: 300px;">
        <canvas #barChart
                baseChart
                type="bar"
                [data]="reclamationChart.data"
                [options]="reclamationChart.options"
                (chartRef)="handleChartRef($event, 'reclamation')">
        </canvas>
      </div>
    </c-card-body>
  </c-card>
</c-col>

</c-row>

<c-row class="align-items-stretch"> <!-- Makes columns stretch to same height -->
  <!-- First Card (Bubble Chart) -->
  <c-col [xl]="6" class="d-flex"> <!-- d-flex ensures proper stretching -->
    <c-card class="mb-4 h-100 w-100"> <!-- h-100 + w-100 fills the column -->
      <c-card-body class="p-4 d-flex flex-column"> <!-- flex-column for proper content flow -->
        <div>
          <h5 cCardTitle class="fs-4 fw-semibold">Répartition des Patients</h5>
          <h6 cCardSubtitle class="fw-normal text-body-secondary">
            par Groupe Sanguin, Âge et Sexe
          </h6>
        </div>
        <div style="height: 400px; flex-grow: 1;"> <!-- flex-grow makes chart fill remaining space -->
          <canvas baseChart
                  type="bubble"
                  [data]="bubbleData"
                  [options]="bubbleChartOptions">
          </canvas>
        </div>
      </c-card-body>
    </c-card>
  </c-col>

  <!-- Second Card (Line Chart) -->
  <c-col [xl]="6" class="d-flex">
    <c-card class="mb-4 h-100 w-100">
      <c-card-body class="p-4 d-flex flex-column">
        <div>
          <h5 cCardTitle class="fs-4 fw-semibold">Évolution des Médicaments Validés et Manquants</h5>
          <h6 cCardSubtitle class="fw-normal text-body-secondary">
            Par mois
          </h6>
        </div>
        <div style="height: 400px; flex-grow: 1;"> <!-- Matching height -->
          <canvas baseChart
                  type="line" 
                  [data]="medsChartData" 
                  [options]="medsChartOptions">
          </canvas>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>

<!-- First Row (2-column layout) -->
<c-row class="mb-4">  <!-- Added mb-4 for bottom spacing -->
  <c-col [xl]="6">
    <!-- First card content -->
  </c-col>
  <c-col [xl]="6">
    <!-- Second card content -->
  </c-col>
</c-row>

<!-- Second Row (full-width card) -->
<c-row class="mt-3">  <!-- Added mt-3 for top spacing -->
  <c-col [xl]="12">   <!-- Full width column -->
    <c-card class="mb-4">
      <c-card-body class="pb-4">
        <h5 cCardTitle class="fs-4 fw-semibold">Répartition des Médecins</h5>
        <h6 cCardSubtitle class="fw-normal text-body-secondary mb-3">
          Par Spécialité Médicale
        </h6>
        <div style="height: 400px;position: relative;">
          <canvas baseChart
                  type="bar"
                  [data]="doctorServiceChartData"
                  [options]="doctorServiceChartOptions"
                  [plugins]="barChartPlugins">
                  
          </canvas>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
