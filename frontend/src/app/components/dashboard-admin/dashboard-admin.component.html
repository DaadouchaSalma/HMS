<c-row>
  <!-- Doughnut Chart -->
  <c-col [xl]="6">
    <c-card class="mb-4">
      <c-card-header>Statut des Chambres</c-card-header>
      <c-card-body>
        <div style="height: 300px;">
          <canvas #doughnutChart
                  baseChart
                  [type]="doughnutChartType"
                  [data]="doughnutChartData"
                  [options]="doughnutChartOptions">
          </canvas>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
<c-col [xl]="8">
  <c-card class="mb-4">
    <c-card-body class="p-4">
      <h5 cCardTitle class="fs-4 fw-semibold">Reclamations by Type</h5>
      <h6 cCardSubtitle class="fw-normal text-body-secondary">
        Year Comparison
      </h6>
      <div style="height: 300px;">
        <canvas #barChart
                baseChart
                type="bar"
                [data]="reclamationChart.data"
                [options]="reclamationChart.options"
                (chartRef)="handleChartRef($event, 'reclamation')">
        </canvas>
      </div>
    </c-card-body>
  </c-card>
</c-col>

</c-row>

<c-col [xl]="6">
      <c-card-group class="mb-4">

<c-card class="mb-2">
  <div class="widget-stat-small">
    <c-widget-stat-c
      [title]="'Médecins'"
      [value]="medecinCount"
      class="widget-stat"
    >
      <ng-template cTemplateId="widgetIconTemplate">
        <svg cIcon height="36" name="cilPeople"></svg>
      </ng-template>
      <ng-template cTemplateId="widgetProgressTemplate">
        <c-progress class="mt-3 mb-0" thin [value]="medecinPercentage" color="success-gradient"></c-progress>
      </ng-template>
    </c-widget-stat-c>
  </div>
</c-card>
<c-card class="mb-2">
  <div class="widget-stat-small">
    <c-widget-stat-c
      [title]="'Pharmaciens'"
      [value]="PharmacienCount"
      class="widget-stat"
    >
      <ng-template cTemplateId="widgetIconTemplate">
        <svg cIcon height="36" name="cilPeople"></svg>
      </ng-template>
      <ng-template cTemplateId="widgetProgressTemplate">
        <c-progress class="mt-3 mb-0" thin [value]="pharmacienPercentage" color="success-gradient"></c-progress>
      </ng-template>
    </c-widget-stat-c>
  </div>
</c-card>
<c-card class="mb-2">
  <div class="widget-stat-small">
    <c-widget-stat-c
      [title]="'Personnels Administratif'"
      [value]="AdminiCount"
      class="widget-stat"
    >
      <ng-template cTemplateId="widgetIconTemplate">
        <svg cIcon height="36" name="cilPeople"></svg>
      </ng-template>
      <ng-template cTemplateId="widgetProgressTemplate">
        <c-progress class="mt-3 mb-0" thin [value]="adminPercentage" color="success-gradient"></c-progress>
      </ng-template>
    </c-widget-stat-c>
  </div>
</c-card>

</c-card-group>
</c-col>

<c-card>
  <c-card-header>
    Patient Demographics (Age, Blood Group, Sex)
  </c-card-header>
  <c-card-body>
    <div style="height: 400px;">
      <canvas baseChart
              type="bubble"
              [data]="bubbleData"
              [options]="bubbleChartOptions">
      </canvas>
    </div>
  </c-card-body>
</c-card>

<c-col [xl]="8">
  <c-card class="mb-4">
    <c-card-header>Medication Status Over Time</c-card-header>
    <c-card-body>
      <div style="height: 300px;">
        <canvas baseChart
          type="line" 
          [data]="medsChartData" 
          [options]="medsChartOptions">
        </canvas>
      </div>
    </c-card-body>
  </c-card>
</c-col>

<c-col [xl]="6">
  <c-card class="mb-4">
    <c-card-header>Doctors by Medical Service</c-card-header>
    <c-card-body>
      <div style="height: 400px;">
        <canvas baseChart
                type="bar"
                [data]="doctorServiceChartData"
                [options]="doctorServiceChartOptions">
        </canvas>
      </div>
    </c-card-body>
  </c-card>
</c-col>
